name: Compilar IPA para iPhone

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-14

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Sincronizar archivos raiz y src
        run: |
          if [ -f "main.c" ]; then cp -f main.c src/main.c; fi
          if [ -f "Info.plist" ]; then cp -f Info.plist src/Info.plist; fi
          if [ -f "LaunchScreen.storyboard" ]; then cp -f LaunchScreen.storyboard src/LaunchScreen.storyboard; fi
          if [ -f "src/LaunchScreen.storyboard" ] && [ ! -f "LaunchScreen.storyboard" ]; then cp -f src/LaunchScreen.storyboard LaunchScreen.storyboard; fi

      - name: Descargar backend raylib-iOS con ANGLE
        run: |
          git clone --depth 1 https://github.com/ghera/raylib-iOS.git raylib-ios
          python3 patch_raylib_ios.py

      - name: Preparar Asset Catalog para el Icono
        run: |
          ICON_FILE=""
          if [ -f "assets/icon.png" ]; then ICON_FILE="assets/icon.png";
          elif [ -f "icon.png" ]; then ICON_FILE="icon.png";
          elif [ -f "assets/AppIcon1024x1024.png" ]; then ICON_FILE="assets/AppIcon1024x1024.png"; fi

          if [ -n "$ICON_FILE" ]; then
            mkdir -p Assets.xcassets/AppIcon.appiconset
            cp "$ICON_FILE" Assets.xcassets/AppIcon.appiconset/icon.png
            echo '{"info":{"version":1,"author":"xcode"}}' > Assets.xcassets/Contents.json
            echo '{"images":[{"idiom":"universal","platform":"ios","size":"1024x1024","filename":"icon.png"}],"info":{"version":1,"author":"xcode"}}' > Assets.xcassets/AppIcon.appiconset/Contents.json
          fi

      - name: Generar Proyecto Xcode con CMake
        run: |
          cmake -B build -G Xcode \
            -DCMAKE_SYSTEM_NAME=iOS \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=15.0

      - name: Compilar App (.app)
        run: |
          xcodebuild build \
            -project build/Astrallitic.xcodeproj \
            -scheme Astrallitic \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            ASSETCATALOG_COMPILER_APPICON_NAME=AppIcon \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CONFIGURATION_BUILD_DIR=build/Release-iphoneos

      - name: Empaquetar a formato .ipa
        run: |
          mkdir -p Payload
          cp -r build/Release-iphoneos/Astrallitic.app Payload/

          # Asegurar que los frameworks de ANGLE estén embebidos correctamente
          mkdir -p Payload/Astrallitic.app/Frameworks
          if [ ! -d Payload/Astrallitic.app/Frameworks/libEGL.framework ]; then
            echo "Copiando libEGL.framework a Payload..."
            cp -r raylib-ios/deps/ANGLE/libEGL.xcframework/ios-arm64/libEGL.framework Payload/Astrallitic.app/Frameworks/
          fi
          if [ ! -d Payload/Astrallitic.app/Frameworks/libGLESv2.framework ]; then
            echo "Copiando libGLESv2.framework a Payload..."
            cp -r raylib-ios/deps/ANGLE/libGLESv2.xcframework/ios-arm64/libGLESv2.framework Payload/Astrallitic.app/Frameworks/
          fi

          # Limpiar cabeceras de desarrollo para mantener limpio el bundle
          rm -rf Payload/Astrallitic.app/Frameworks/libEGL.framework/Headers
          rm -rf Payload/Astrallitic.app/Frameworks/libEGL.framework/Modules
          rm -rf Payload/Astrallitic.app/Frameworks/libGLESv2.framework/Headers
          rm -rf Payload/Astrallitic.app/Frameworks/libGLESv2.framework/Modules

          # Asegurar permisos de ejecución en todos los binarios
          chmod +x Payload/Astrallitic.app/Astrallitic
          chmod +x Payload/Astrallitic.app/Frameworks/libEGL.framework/libEGL
          chmod +x Payload/Astrallitic.app/Frameworks/libGLESv2.framework/libGLESv2

          # Asegurar que todos los assets estén en el bundle
          cp -r assets/* Payload/Astrallitic.app/

          # Compilar Assets.car y generar todos los iconos de iOS
          ICON_FILE=""
          if [ -f "assets/icon.png" ]; then ICON_FILE="assets/icon.png";
          elif [ -f "icon.png" ]; then ICON_FILE="icon.png";
          elif [ -f "assets/AppIcon1024x1024.png" ]; then ICON_FILE="assets/AppIcon1024x1024.png"; fi

          if [ -n "$ICON_FILE" ]; then
            # Generar variantes de icono con sips
            sips -z 120 120 "$ICON_FILE" --out Payload/Astrallitic.app/AppIcon60x60@2x.png || true
            sips -z 180 180 "$ICON_FILE" --out Payload/Astrallitic.app/AppIcon60x60@3x.png || true
            sips -z 152 152 "$ICON_FILE" --out Payload/Astrallitic.app/AppIcon76x76@2x.png || true
            sips -z 167 167 "$ICON_FILE" --out Payload/Astrallitic.app/AppIcon83.5x83.5@2x.png || true
            sips -z 1024 1024 "$ICON_FILE" --out Payload/Astrallitic.app/AppIcon1024x1024.png || true
            cp "$ICON_FILE" Payload/Astrallitic.app/icon.png

            # Compilar Assets.car con actool
            xcrun actool Assets.xcassets \
              --compile Payload/Astrallitic.app \
              --platform iphoneos \
              --minimum-deployment-target 15.0 \
              --target-device iphone \
              --target-device ipad \
              --app-icon AppIcon \
              --output-format human-readable-text || true

            # Verificar Assets.car
            if [ -f "Payload/Astrallitic.app/Assets.car" ]; then
              echo ">>> SUCCESS: Assets.car compilado en el bundle <<<"
            else
              echo ">>> WARNING: Assets.car no encontrado <<<"
            fi
          fi

          # Generar artwork para Sideloadly / iTunes
          if [ -f "assets/icon.png" ]; then
            cp assets/icon.png iTunesArtwork
            cp assets/icon.png iTunesArtwork@2x
          fi

          # Firma Ad-hoc de dentro hacia afuera (requisito estricto de iOS)
          codesign --force --sign - Payload/Astrallitic.app/Frameworks/libEGL.framework || true
          codesign --force --sign - Payload/Astrallitic.app/Frameworks/libGLESv2.framework || true
          codesign --force --sign - Payload/Astrallitic.app || true

          # Empaquetar manteniendo symlinks de frameworks y artwork
          if [ -f "iTunesArtwork" ]; then
            zip -yr Astrallitic.ipa Payload iTunesArtwork iTunesArtwork@2x
            rm -f iTunesArtwork iTunesArtwork@2x
          else
            zip -yr Astrallitic.ipa Payload
          fi
          rm -rf Payload

      - name: Subir archivo IPA como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: Astrallitic-IPA
          path: Astrallitic.ipa
          retention-days: 14
